services:
  shh2-mealie:
    image: hkotel/mealie:v3.27.0
    container_name: shh2-mealie
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18802:9000"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh2-mealie/data:/app/data
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

x-app-meta:
  web:
    port: 18802
    protocol: http

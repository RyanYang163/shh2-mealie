name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      platform:
        description: "目标架构（Deb 应用用）"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64

permissions:
  contents: write

env:
  # 上游版本锁定 —— 升级时改这里，不要用 floating 分支
  UPSTREAM_REPO: ""
  UPSTREAM_TAG: ""
  # 产物是纯静态前端（true）还是自带二进制（false）
  BUILD_FROM_UPSTREAM: "none"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: meta
        run: |
          set -euo pipefail
          APPID=$(python3 -c "import json;print(json.load(open('config.ini'))['id'])")
          VER=$(python3 -c "import json;print(json.load(open('config.ini'))['version'])")
          echo "appid=$APPID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            # 指引 10.2 Step 3：tag 与 config.ini 的 version 必须完全一致（前缀 v 可选）
            if [ "${TAG#v}" != "$VER" ]; then
              echo "::error::tag(${TAG}) 与 config.ini 的 version(${VER}) 不一致，平台会拒绝"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: 守卫 —— 已存在的 Release 一律拒绝覆盖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 坑 11：重新构建会改变 deb 内嵌时间戳 → sha256 变化 → 平台 checksum mismatch
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。禁止覆盖 —— 覆盖会改变资产哈希，导致平台校验失败。请改用新的版本号。"
            exit 1
          fi
          echo "Release $TAG 尚不存在，可以继续。"

      - name: 镜像漏洞扫描（审核项 T1 / S10）
        run: |
          set -euo pipefail
          IMG=$(grep -m1 '^ *image:' docker-compose.yml | sed 's/.*image: *//' | tr -d '"')
          echo "扫描镜像：$IMG"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version
          # 报告给审核方看（人类可读）
          trivy image --severity HIGH,CRITICAL --no-progress \
            --format table -o trivy-report.txt "$IMG" || true
          # 计数用（机器可读）
          trivy image --severity HIGH,CRITICAL --no-progress \
            --format json -o trivy-report.json "$IMG" || true
          [ -f trivy-report.txt ] || echo "（trivy 未产出报告，请检查日志）" > trivy-report.txt
          CNT=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('trivy-report.json'))
          except Exception:
              print('0'); raise SystemExit
          n = 0
          for r in d.get('Results', []):
              n += len(r.get('Vulnerabilities') or [])
          print(n)
          PY
          )
          echo "HIGH/CRITICAL 漏洞数：$CNT"
          echo "count=$CNT" >> "$GITHUB_OUTPUT"
          if [ "$CNT" != "0" ]; then
            echo "::error::镜像存在 $CNT 个 HIGH/CRITICAL 漏洞，审核要求为 0。请升级上游镜像版本后重新发布。"
            exit 1
          fi
        id: trivy

      - name: 构建 Docker 应用包
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh

      - name: 检查构建产物
        id: asset
        run: |
          set -euo pipefail
          APPID="${{ steps.meta.outputs.appid }}"
          TGZ="build/output/${APPID}.tar.gz"
          [ -f "$TGZ" ] || { echo "::error::未找到 $TGZ"; exit 1; }
          [ -f "${TGZ}.sha256" ] || { echo "::error::缺少 ${TGZ}.sha256 伴随文件"; exit 1; }
          # 指引 6.2：归档根层恰好 4 个文件（漏洞报告是独立资产，不计入包内）
          N=$(tar -tzf "$TGZ" | grep -c '[^/]$')
          if [ "$N" -ne 4 ]; then
            echo "::error::归档根层文件数为 ${N}，必须恰好为 4"
            exit 1
          fi
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.asset.outputs.tgz }}" \
            "${{ steps.asset.outputs.tgz }}.sha256" \
            trivy-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.appid }} ${{ steps.meta.outputs.version }}" \
            --notes "TOS 7 Docker 应用包。需先在 TOS 应用中心安装并启用 DockerEngine。

          附 trivy-report.txt：镜像层漏洞扫描报告（HIGH/CRITICAL = 0）。"
